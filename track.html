<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<!-- The link carries the trip's code; nothing here should end up in a search index. -->
<meta name="robots" content="noindex, nofollow" />
<meta name="referrer" content="no-referrer" />
<meta name="theme-color" content="#7B3FF2" />
<title>متابعة رحلة — ماشي</title>
<!-- What a messenger shows under the link. It reads the page without the code (that stays
     after the #), so it never sees the trip. -->
<meta name="description" content="تابع الرحلة مباشرةً على الخريطة حتى الوصول." />
<meta property="og:site_name" content="ماشي" />
<meta property="og:title" content="متابعة رحلة على ماشي" />
<meta property="og:description" content="تابع الرحلة مباشرةً على الخريطة حتى الوصول." />
<meta property="og:type" content="website" />
<!--
  Trip sharing (migration 0068): whoever opens a rider's link watches the trip
  live — no account, no app, and nothing here can change or cancel the trip.

  This is a template. `npm run share:build` fills in the Supabase URL and its
  public key from .env and writes the page to .share-page/ — that copy is the
  one to publish (web/README.md). The code
  comes after the # in the link, so the browser never sends it to the server
  hosting this page.

  The page asks get_shared_ride(code) every few seconds while it's visible:
  a visitor without an account has no realtime, and no table access at all
  (0064) — that one function is all it can call.
-->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet" />
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
  :root {
    --primary: #7B3FF2;
    --primary-soft: #EFE7FE;
    --accent: #F6C31C;
    --text: #1F1B2D;
    --muted: #6B6675;
    --border: #D9D5E6;
    --surface: #F7F6FA;
    --white: #FFFFFF;
    --success: #3D8B5A;
    --success-soft: #EDF6EF;
    --warning: #B45309;
    --warning-soft: #FFF7ED;
    --danger: #DC2626;
    --sheet-radius: 28px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: 'Tajawal', system-ui, sans-serif;
    color: var(--text);
    background: var(--white);
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; }

  /* ---- the live view: map on top, sheet below (phones) or beside it (wide screens) ---- */
  .live { display: none; min-height: 100%; flex-direction: column; }
  .live.on { display: flex; }
  .map-wrap { position: relative; height: 52vh; min-height: 300px; flex: none; }
  #map { position: absolute; inset: 0; }
  .brand {
    position: absolute; top: 12px; inset-inline-start: 16px; z-index: 2;
    display: flex; align-items: center; gap: 10px;
    padding: 8px 14px; border-radius: 14px;
    background: var(--primary); color: var(--white);
    box-shadow: 0 4px 14px rgba(31, 27, 45, 0.18);
  }
  .brand img { height: 22px; display: block; }
  .brand span { font-size: 14px; font-weight: 500; }
  .recenter {
    position: absolute; bottom: 44px; inset-inline-end: 16px; z-index: 2;
    display: none; align-items: center; gap: 6px;
    padding: 9px 14px; border: 1px solid var(--border); border-radius: 999px;
    background: var(--white); color: var(--primary); font-size: 14px; font-weight: 700;
    box-shadow: 0 4px 14px rgba(31, 27, 45, 0.14); cursor: pointer;
  }
  .recenter.on { display: inline-flex; }

  .sheet {
    position: relative; z-index: 3; flex: 1;
    margin-top: -24px; padding: 22px 16px calc(24px + env(safe-area-inset-bottom));
    border-radius: var(--sheet-radius) var(--sheet-radius) 0 0;
    background: var(--white);
    box-shadow: 0 -4px 16px rgba(31, 27, 45, 0.10);
    display: flex; flex-direction: column; gap: 14px;
  }
  .sheet-inner { width: 100%; max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }

  @media (min-width: 900px) {
    .live.on { display: block; height: 100%; }
    .map-wrap { position: fixed; inset: 0; height: auto; }
    .sheet {
      position: fixed; top: 16px; bottom: 16px; inset-inline-start: 16px;
      width: 400px; margin: 0; border-radius: 20px; overflow-y: auto;
      box-shadow: 0 8px 30px rgba(31, 27, 45, 0.18);
    }
    .brand { inset-inline-start: auto; inset-inline-end: 16px; }
    .recenter { bottom: 32px; }
  }

  .pill {
    align-self: flex-start;
    display: inline-flex; align-items: center; gap: 8px;
    padding: 6px 12px; border-radius: 999px;
    font-size: 13px; font-weight: 700;
    background: var(--primary-soft); color: var(--primary);
  }
  .pill::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
  .pill.pulsing::before { animation: pulse 1.6s ease-in-out infinite; }
  .pill.green { background: var(--success-soft); color: var(--success); }
  .pill.grey { background: var(--surface); color: var(--muted); }
  @keyframes pulse { 50% { opacity: 0.25; } }

  h1 { margin: 0; font-size: 24px; line-height: 1.35; font-weight: 700; }
  .eta-caption { margin: 0; font-size: 13px; color: var(--muted); }
  .eta { margin: 0; font-size: 24px; font-weight: 700; color: var(--primary); }
  .sub { margin: 0; font-size: 15px; line-height: 1.6; color: var(--muted); }

  .notice {
    display: none; gap: 8px; align-items: flex-start;
    padding: 10px 12px; border-radius: 12px;
    font-size: 13px; line-height: 1.6;
  }
  .notice.on { display: flex; }
  .notice.warn { background: var(--warning-soft); color: var(--warning); }
  .notice svg { flex: none; margin-top: 2px; }

  .card { padding: 16px; border-radius: 14px; background: var(--surface); }
  .driver { display: none; align-items: center; gap: 12px; }
  .driver.on { display: flex; }
  .avatar {
    flex: none; width: 48px; height: 48px; border-radius: 50%;
    display: grid; place-items: center;
    background: var(--primary-soft); color: var(--primary); font-size: 20px; font-weight: 700;
  }
  .driver-text { flex: 1; min-width: 0; }
  .driver-name { font-size: 17px; font-weight: 700; }
  .driver-car { font-size: 13px; color: var(--muted); }
  .plate-block { flex: none; display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .plate {
    min-width: 84px; padding: 6px 10px; text-align: center;
    border: 1px solid var(--border); border-radius: 12px; background: var(--white);
    font-size: 14px; font-weight: 700; direction: ltr; unicode-bidi: isolate;
  }
  .plate-label { font-size: 11px; color: var(--muted); }

  .route { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
  .route li { display: flex; gap: 12px; align-items: flex-start; }
  .dot { flex: none; width: 12px; height: 12px; margin-top: 5px; border-radius: 50%; border: 2px solid var(--white); box-shadow: 0 0 0 1px var(--border); }
  .dot.pickup { background: var(--primary); }
  .dot.dropoff { background: var(--accent); }
  .route-label { display: block; font-size: 12px; color: var(--muted); }
  .route-value { display: block; font-size: 15px; overflow-wrap: anywhere; }
  .route-value.done { text-decoration: line-through; color: var(--muted); }

  .meta { margin: 0; font-size: 12px; color: var(--muted); }
  .readonly {
    margin: 0; padding-top: 14px; border-top: 1px solid var(--border);
    font-size: 12px; line-height: 1.7; color: var(--muted);
  }
  .conn { display: none; margin: 0; font-size: 12px; color: var(--warning); }
  .conn.on { display: block; }

  /* ---- the message view: invalid link, stopped, finished, loading ---- */
  .message {
    display: none; min-height: 100%; padding: 32px 16px;
    flex-direction: column; align-items: center; justify-content: center; gap: 22px;
    background: var(--primary);
  }
  .message.on { display: flex; }
  .message-logo { height: 40px; }
  .message-box {
    width: 100%; max-width: 420px; padding: 28px 22px; border-radius: 24px;
    background: var(--white); text-align: center;
    display: flex; flex-direction: column; align-items: center; gap: 12px;
  }
  .message-icon { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; background: var(--primary-soft); color: var(--primary); }
  .message-title { margin: 0; font-size: 22px; font-weight: 700; }
  .message-text { margin: 0; font-size: 15px; line-height: 1.7; color: var(--muted); }

  /* ---- map markers ---- */
  .pin { width: 22px; height: 22px; border-radius: 50%; border: 4px solid var(--white); box-shadow: 0 2px 6px rgba(31, 27, 45, 0.35); }
  .pin.pickup { background: var(--primary); }
  .pin.dropoff { background: var(--accent); }
  .car {
    width: 38px; height: 38px; border-radius: 12px;
    display: grid; place-items: center;
    background: var(--primary); border: 3px solid var(--white);
    box-shadow: 0 3px 10px rgba(31, 27, 45, 0.35);
    transition: opacity 0.3s;
  }
  .car.faded { opacity: 0.45; }
  .car svg { transition: transform 0.4s; }
  .maplibregl-ctrl-attrib { font-family: system-ui, sans-serif; }
  /* The map's own corner controls (the credits must stay visible). On phones the sheet
     covers the map's bottom 24px; on wide screens it covers the map's right side, and the
     brand its top-left corner. */
  .maplibregl-ctrl-bottom-right, .maplibregl-ctrl-bottom-left { margin-bottom: 24px; }
  @media (min-width: 900px) {
    .maplibregl-ctrl-bottom-right, .maplibregl-ctrl-bottom-left { margin-bottom: 0; }
    .maplibregl-ctrl-bottom-right { right: 432px; }
    .maplibregl-ctrl-top-left { top: 64px; }
  }
</style>
</head>
<body>

<!-- Loading, and every state that has no trip to show. -->
<main class="message on" id="messageView" aria-live="polite">
  <!-- The wordmark is yellow: it sits on the purple, not in the white box. -->
  <img class="message-logo" src="mashi-wordmark.png" alt="ماشي" onerror="this.remove()" />
  <div class="message-box">
    <div class="message-icon" id="messageIcon"></div>
    <h1 class="message-title" id="messageTitle">جارٍ تحميل الرحلة...</h1>

<main class="live" id="liveView">
  <div class="map-wrap">
    <div id="map" role="region" aria-label="خريطة الرحلة"></div>
    <div class="brand"><img src="mashi-wordmark.png" alt="ماشي" onerror="this.remove()" /><span>متابعة رحلة</span></div>
    <button class="recenter" id="recenter" type="button">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
      توسيط الخريطة

  <section class="sheet">

      <div class="card driver" id="driverCard">

        </div>
        <div class="plate-block">
          <div class="plate" id="driverPlate"></div>
          <div class="plate-label">لوحة المركبة</div>

      <ol class="route">
        <li>
          <span class="dot pickup" aria-hidden="true"></span>

      <p class="readonly">هذه الصفحة للمتابعة فقط، ولا يمكن من خلالها تعديل الرحلة أو إلغاؤها. تتوقف المتابعة عندما يوقف صاحب الرحلة المشاركة، أو بعد ساعة من انتهاء الرحلة.</p>
    </div>
  </section>
</main>

<script>
'use strict';

// Filled in by `npm run share:build` from .env.
const SUPABASE_URL = 'https://rdexudpxeqzkjmgibydn.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_pPCgR94KK6HMHu1yEuyt2A_cJ7po5-L';
// OpenFreeMap: no key and no quota. MapTiler's free plan allows one key and that one is
// the apps', which a public page would give away.
const MAP_STYLE = 'https://tiles.openfreemap.org/styles/bright';

const POLL_MS = 5000;               // how often the trip is asked for while the page is visible
const MAX_RETRY_MS = 30000;         // the longest wait between tries while the server can't be reached
const STALE_MS = 60000;             // same threshold as the rider's own trip screen
const GLIDE_MS = 1200;              // the car slides between positions, like in the app
const GLIDE_MAX_KM = 1;             // a longer jump is drawn at once
const HEADING_MIN_MOVE_KM = 0.015;  // below this the car is standing: keep its last heading
// Straight line × 1.3 at 30 km/h — the app's own estimate (src/utils/eta.ts), which repeats
// fare_config.road_distance_factor. If that changes, change both.
const ROAD_DISTANCE_FACTOR = 1.3;
const AVG_SPEED_KMH = 30;
const HARTHA = [47.735139, 30.692804];
const TIME_LOCALE = 'ar-IQ-u-nu-latn';

const ACTIVE = ['assigned', 'driver_arriving', 'driver_arrived', 'in_progress'];
const HEADING_TO_PICKUP = ['assigned', 'driver_arriving'];

const $ = (id) => document.getElementById(id);

// ---------------------------------------------------------------------------
// Small helpers
// ---------------------------------------------------------------------------
function distanceKm(a, b) {
  const R = 6371;
  const toRad = (d) => (d * Math.PI) / 180;
  const dLat = toRad(b.lat - a.lat);
  const dLng = toRad(b.lng - a.lng);
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(a.lat)) * Math.cos(toRad(b.lat)) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}

function bearing(a, b) {
  const toRad = (d) => (d * Math.PI) / 180;
  const y = Math.sin(toRad(b.lng - a.lng)) * Math.cos(toRad(b.lat));
  const x = Math.cos(toRad(a.lat)) * Math.sin(toRad(b.lat)) -
    Math.sin(toRad(a.lat)) * Math.cos(toRad(b.lat)) * Math.cos(toRad(b.lng - a.lng));
  return ((Math.atan2(y, x) * 180) / Math.PI + 360) % 360;
}

function etaMinutes(from, to) {
  const km = distanceKm(from, to) * ROAD_DISTANCE_FACTOR;
  return Math.max(1, Math.round((km / AVG_SPEED_KMH) * 60));
}

function etaPhrase(minutes) {
  if (minutes === 1) return 'دقيقة واحدة تقريبًا';
  if (minutes === 2) return 'دقيقتان تقريبًا';
  if (minutes <= 10) return minutes + ' دقائق تقريبًا';
  return minutes + ' دقيقة تقريبًا';
}

function sincePhrase(ms) {
  const minutes = Math.max(1, Math.floor(ms / 60000));
  if (minutes === 1) return 'منذ دقيقة';
  if (minutes === 2) return 'منذ دقيقتين';
  if (minutes <= 10) return 'منذ ' + minutes + ' دقائق';
  return 'منذ ' + minutes + ' دقيقة';
}

function formatTime(iso) {
  return new Date(iso).toLocaleTimeString(TIME_LOCALE, { hour: 'numeric', minute: '2-digit' });
}

// The app's cleanAddress (src/utils/address.ts): a Plus Code, dashes, or an address that is only
// the province and country don't say where to go.
const PLUS_CODE_PART_RE = /^[A-Za-z0-9]{4,}\+[A-Za-z0-9]{2,}$/;
const EMPTY_PART_RE = /^[-–—.\s]*$/;
const GENERIC_PARTS = new Set(['محافظة البصرة', 'البصرة', 'العراق', 'Basra', 'Basra Governorate', 'Iraq']);
function cleanAddress(raw) {
  if (!raw) return null;
  const parts = String(raw).split(/[,،]/).map((p) => p.trim()).filter((p) => !EMPTY_PART_RE.test(p));
  if (!parts.length || PLUS_CODE_PART_RE.test(parts[0]) || parts.every((p) => GENERIC_PARTS.has(p))) return null;
  return parts.join('، ');
}

const ICONS = {
  search: '<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>',
  link: '<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/><path d="M3 3l18 18"/></svg>',
  stop: '<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><rect x="9" y="9" width="6" height="6" rx="1"/></svg>',
  done: '<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>',
  cloud: '<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M17.5 19H7a5 5 0 1 1 1.4-9.8A6 6 0 0 1 20 11a4 4 0 0 1-2.5 8z"/><path d="M3 3l18 18"/></svg>',
  arrow: '<svg width="18" height="18" viewBox="0 0 24 24" fill="#FFFFFF"><path d="M12 2 20 21 12 16.5 4 21z"/></svg>',
};

// ---------------------------------------------------------------------------
// The message view
// ---------------------------------------------------------------------------
function showMessage(icon, title, text) {
  stopPolling();
  $('liveView').classList.remove('on');
  $('messageView').classList.add('on');
  $('messageIcon').innerHTML = ICONS[icon] || '';
  $('messageTitle').textContent = title;
  $('messageText').textContent = text || '';
}

const MESSAGES = {
  invalid: ['link', 'رابط المتابعة غير صالح', 'يرجى التأكد من فتح الرابط كاملًا كما وصلك.'],
  stopped: ['stop', 'أُوقفت مشاركة الرحلة', 'أوقف صاحب الرحلة المشاركة، فلم تعد تفاصيلها متاحة.'],
  closed: ['done', 'انتهت مشاركة الرحلة', 'انتهت الرحلة، ولم تعد تفاصيلها متاحة.'],
  offline: ['cloud', 'تعذّر الاتصال', 'يرجى التأكد من الاتصال بالإنترنت. جارٍ إعادة المحاولة...'],
  unbuilt: ['link', 'الصفحة غير مهيّأة', 'هذه نسخة القالب. يجب بناء الصفحة بالأمر npm run share:build قبل نشرها.'],
};

// ---------------------------------------------------------------------------
// The server
// ---------------------------------------------------------------------------
const TOKEN_RE = /^[A-Za-z0-9_-]{24}$/;

/**
 * The code after the #. A messenger may carry extra text after it, or encode it; a hash
 * that doesn't decode is just a bad link, not a reason for the page to stop.
 */
function readToken() {
  let hash = (location.hash || '').replace(/^#/, '');
  try { hash = decodeURIComponent(hash); } catch (err) {}
  const match = hash.trim().match(/^[A-Za-z0-9_-]{24}(?![A-Za-z0-9_-])/);
  return match ? match[0] : '';
}

const token = readToken();
const configured = !SUPABASE_URL.startsWith('__');
let pollTimer = null;
let polling = false;     // one request at a time, so an older answer never lands after a newer one
let retryMs = POLL_MS;
let lastAnswer = null;   // the last trip the server sent
let answeredAt = 0;      // when it arrived, on this device's clock
let finished = false;    // an answer that won't change again: stopped, over, or no such link

async function fetchTrip() {
  const res = await fetch(SUPABASE_URL + '/rest/v1/rpc/get_shared_ride', {
    method: 'POST',
    headers: {
      apikey: SUPABASE_ANON_KEY,
      Authorization: 'Bearer ' + SUPABASE_ANON_KEY,
      'Content-Type': 'application/json',
    },
    body: JSON.stringify({ p_token: token }),
    cache: 'no-store',
  });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  return res.json();
}

function stopPolling() {
  if (pollTimer) clearTimeout(pollTimer);
  pollTimer = null;
}

function schedule(ms) {
  stopPolling();
  if (document.visibilityState === 'visible') pollTimer = setTimeout(poll, ms);
}

async function poll() {
  if (polling) return;
  polling = true;
  let answer;
  try {
    answer = await fetchTrip();
  } catch (err) {
    console.warn('[track] Could not reach the server', err);
    if (lastAnswer && lastAnswer.state === 'live') $('connNotice').classList.add('on');
    else if (!lastAnswer) showMessage(...MESSAGES.offline);
    retryMs = Math.min(MAX_RETRY_MS, retryMs * 2);
    schedule(retryMs);
    return;
  } finally {
    polling = false;
  }

  retryMs = POLL_MS;
  $('connNotice').classList.remove('on');
  answeredAt = Date.now();
  lastAnswer = answer;
  finished = !answer || answer.state !== 'live';
  if (!answer) return showMessage(...MESSAGES.invalid);
  if (answer.state === 'stopped') return showMessage(...MESSAGES.stopped);
  if (answer.state === 'closed') return showMessage(...MESSAGES.closed);
  // A mistake in drawing is not a lost connection: log it, and keep asking.
  try {
    renderTrip(answer);
  } catch (err) {
    console.error('[track] Could not draw the trip', err);
  }
  // A trip that ended won't change again: show it, and stop asking.
  if (!finished) schedule(POLL_MS);
}

// Another link pasted into the same tab: start over with its code.
window.addEventListener('hashchange', () => location.reload());

// Hidden tabs don't ask; coming back asks at once.
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return stopPolling();
  if (!finished && configured && token) poll();
});

// ---------------------------------------------------------------------------
// The map
// ---------------------------------------------------------------------------
let map = null;
let mapReady = false;
let following = true;       // the camera keeps the trip framed until the viewer moves the map
let markers = {};
let carShown = null;        // where the car is drawn: { lat, lng }
let carHeading = 0;
let lastHeadingPoint = null;
let glide = null;

/**
 * The map is extra: if its library or style can't load (blocked, OpenFreeMap down), the
 * sheet still says where the trip stands and who is driving.
 */
function initMap() {
  if (map || typeof maplibregl === 'undefined') return;
  try {
    createMap();
  } catch (err) {
    console.error('[track] Could not start the map', err);
    map = null;
  }
}

function createMap() {
  if (maplibregl.getRTLTextPluginStatus() === 'unavailable') {
    // Without it MapLibre draws Arabic letters unjoined and left to right.
    maplibregl.setRTLTextPlugin('https://unpkg.com/@mapbox/mapbox-gl-rtl-text@0.2.3/mapbox-gl-rtl-text.min.js', true);
  }
  map = new maplibregl.Map({
    container: 'map',
    style: MAP_STYLE,
    center: HARTHA,
    zoom: 13,
    dragRotate: false,
    pitchWithRotate: false,
    touchPitch: false,
    attributionControl: { compact: true },
  });
  map.touchZoomRotate.disableRotation();
  map.addControl(new maplibregl.NavigationControl({ showCompass: false }), 'top-left');
  map.on('style.load', () => {
    // Arabic names first, where the data has them. Only labels that show a name — road
    // shields show the road's number.
    for (const layer of map.getStyle().layers) {
      const field = layer.type === 'symbol' ? map.getLayoutProperty(layer.id, 'text-field') : undefined;
      if (field !== undefined && JSON.stringify(field).includes('name')) {
        try { map.setLayoutProperty(layer.id, 'text-field', ['coalesce', ['get', 'name:ar'], ['get', 'name']]); } catch (err) {}
      }
    }
    map.addSource('trip', { type: 'geojson', data: emptyLine() });
    map.addLayer({
      id: 'trip-line', type: 'line', source: 'trip',
      layout: { 'line-cap': 'round', 'line-join': 'round' },
      // Dashed: a straight line between the two points, not the road taken.
      paint: { 'line-color': '#7B3FF2', 'line-width': 4, 'line-opacity': 0.55, 'line-dasharray': [1.5, 1.5] },
    });
    mapReady = true;
    if (lastAnswer && lastAnswer.pickup) renderMap(lastAnswer);
  });
  // A drag or zoom by the viewer stops the camera following until they ask for it again.
  const stopFollowing = (e) => {
    if (e.originalEvent) {
      following = false;
      $('recenter').classList.add('on');
    }
  };
  map.on('dragstart', stopFollowing);
  map.on('zoomstart', stopFollowing);
  $('recenter').addEventListener('click', () => {
    following = true;
    $('recenter').classList.remove('on');
    if (lastAnswer) frame(lastAnswer, true);
  });
}

function emptyLine() {
  return { type: 'Feature', geometry: { type: 'LineString', coordinates: [] } };
}

function pinElement(kind) {
  const el = document.createElement('div');
  el.className = 'pin ' + kind;
  el.setAttribute('aria-hidden', 'true');
  return el;
}

function carElement() {
  const el = document.createElement('div');
  el.className = 'car';
  el.innerHTML = ICONS.arrow;
  el.setAttribute('role', 'img');
  el.setAttribute('aria-label', 'السائق');
  return el;
}

function placeMarker(id, makeElement, point) {
  if (!markers[id]) markers[id] = new maplibregl.Marker({ element: makeElement() }).setLngLat([point.lng, point.lat]).addTo(map);
  else markers[id].setLngLat([point.lng, point.lat]);
}

function removeMarker(id) {
  if (markers[id]) markers[id].remove();
  delete markers[id];
}

/** Slides the car to a new position over GLIDE_MS — or jumps, after a long gap. */
function moveCar(to) {
  if (glide) cancelAnimationFrame(glide.frame);
  const from = carShown;
  if (!from || distanceKm(from, to) > GLIDE_MAX_KM) {
    carShown = to;
    markers.car.setLngLat([to.lng, to.lat]);
    return;
  }
  const start = performance.now();
  const step = (now) => {
    const t = Math.min(1, (now - start) / GLIDE_MS);
    const e = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
    carShown = { lat: from.lat + (to.lat - from.lat) * e, lng: from.lng + (to.lng - from.lng) * e };
    markers.car.setLngLat([carShown.lng, carShown.lat]);
    if (t < 1) glide.frame = requestAnimationFrame(step);
  };
  glide = { frame: requestAnimationFrame(step) };
}

/**
 * Android reports heading 0 (north) for a car standing still, so a heading is only taken once the
 * car has moved: the reported one if it isn't 0, otherwise the direction of the move itself.
 */
function updateHeading(loc) {
  const point = { lat: loc.lat, lng: loc.lng };
  if (!lastHeadingPoint) {
    lastHeadingPoint = point;
    if (loc.heading) carHeading = loc.heading;
    return;
  }
  if (distanceKm(lastHeadingPoint, point) < HEADING_MIN_MOVE_KM) return;
  carHeading = loc.heading ? loc.heading : bearing(lastHeadingPoint, point);
  lastHeadingPoint = point;
}

function renderMap(trip) {
  if (!mapReady) return;
  const pickup = trip.pickup;
  const dropoff = trip.dropoff;
  placeMarker('pickup', () => pinElement('pickup'), pickup);
  placeMarker('dropoff', () => pinElement('dropoff'), dropoff);
  map.getSource('trip').setData({
    type: 'Feature',
    geometry: { type: 'LineString', coordinates: [[pickup.lng, pickup.lat], [dropoff.lng, dropoff.lat]] },
  });

  const loc = trip.driver_location;
  if (loc && trip.state === 'live') {
    updateHeading(loc);
    const isNew = !markers.car;
    placeMarker('car', carElement, carShown || loc);
    if (isNew) carShown = { lat: loc.lat, lng: loc.lng };
    else moveCar({ lat: loc.lat, lng: loc.lng });
    const el = markers.car.getElement();
    el.querySelector('svg').style.transform = 'rotate(' + Math.round(carHeading) + 'deg)';
    el.classList.toggle('faded', locationAgeMs(trip) > STALE_MS);
  } else {
    removeMarker('car');
    carShown = null;
  }
  frame(trip, false);
}

/** Keeps in view what matters now: the driver and the pickup on the way, the driver and the destination on board. */
function frame(trip, animate) {
  if (!following || !mapReady) return;
  const loc = trip.state === 'live' ? trip.driver_location : null;
  let points;
  if (loc && HEADING_TO_PICKUP.includes(trip.status)) points = [loc, trip.pickup];
  else if (loc && trip.status === 'in_progress') points = [loc, trip.dropoff];
  else if (loc && trip.status === 'driver_arrived') points = [loc, trip.pickup];
  else points = [trip.pickup, trip.dropoff];

  const wide = window.matchMedia('(min-width: 900px)').matches;
  const padding = wide ? { top: 100, bottom: 80, left: 80, right: 460 } : { top: 80, bottom: 60, left: 50, right: 50 };
  const bounds = new maplibregl.LngLatBounds();
  points.forEach((p) => bounds.extend([p.lng, p.lat]));
  map.fitBounds(bounds, { padding, maxZoom: 16, duration: animate ? 800 : 600 });
}

// ---------------------------------------------------------------------------
// The sheet
// ---------------------------------------------------------------------------
function locationAgeMs(trip) {
  const loc = trip.driver_location;
  if (!loc) return null;
  // On the server's clock, plus the time since its answer arrived.
  const atAnswer = new Date(trip.server_time).getTime() - new Date(loc.updated_at).getTime();
  return Math.max(0, atAnswer) + (Date.now() - answeredAt);
}

function setPill(text, tone, live) {
  const pill = $('pill');
  pill.textContent = text;
  pill.className = 'pill' + (tone ? ' ' + tone : '') + (live ? ' pulsing' : '');
}

function renderTrip(trip) {
  $('messageView').classList.remove('on');
  $('liveView').classList.add('on');
  initMap();
  // The map was laid out while hidden on the first answer.
  requestAnimationFrame(() => map && map.resize());

  const status = trip.status;
  const live = trip.state === 'live';
  const loc = live ? trip.driver_location : null;
  const age = locationAgeMs(trip);
  const stale = age != null && age > STALE_MS;
  const onBoard = status === 'in_progress';

  let headline = '';
  let sub = '';
  let etaCaption = '';
  let etaTarget = null;

  if (!live) {
    if (status === 'completed') {
      setPill('انتهت الرحلة', 'green');
      headline = 'وصلت الرحلة إلى وجهتها';
      sub = trip.ended_at ? 'الساعة ' + formatTime(trip.ended_at) + '.' : '';
    } else if (status === 'cancelled') {
      setPill('أُلغيت الرحلة', 'grey');
      headline = 'أُلغيت الرحلة';
      // Who cancelled, when the server knows; otherwise no guess.
      sub = trip.cancelled_by === 'driver'
        ? 'ألغى السائق الرحلة.'
        : trip.cancelled_by === 'rider'
          ? 'ألغى الراكب الرحلة.'
          : trip.cancelled_by === 'system'
            ? 'أُلغيت الرحلة تلقائيًا لعدم اكتمالها في الوقت المحدد.'
            : '';
    } else {
      setPill('انتهى الطلب', 'grey');
      headline = 'لم يتوفر سائق';
      sub = 'انتهى طلب الرحلة دون العثور على سائق.';
    }
  } else if (status === 'requested') {
    setPill('جارٍ البحث', '', true);
    headline = 'جارٍ البحث عن سائق';
    sub = 'ستظهر تفاصيل السائق هنا فور قبوله الرحلة.';
  } else if (HEADING_TO_PICKUP.includes(status)) {
    setPill('السائق في الطريق', '', true);
    headline = 'السائق في الطريق إلى نقطة الانطلاق';
    etaCaption = 'الوصول إلى نقطة الانطلاق خلال';
    etaTarget = trip.pickup;
  } else if (status === 'driver_arrived') {
    setPill('وصل السائق', '', true);
    headline = 'وصل السائق إلى نقطة الانطلاق';
    sub = trip.arrived_at ? 'منذ الساعة ' + formatTime(trip.arrived_at) + '، بانتظار بدء الرحلة.' : 'بانتظار بدء الرحلة.';
  } else if (onBoard) {
    setPill('الرحلة جارية', 'green', true);
    headline = 'الرحلة جارية';
    sub = trip.started_at ? 'بدأت الساعة ' + formatTime(trip.started_at) + '.' : '';
    etaCaption = 'الوصول إلى الوجهة خلال';
    etaTarget = trip.dropoff;
  }

  setText($('headline'), headline);
  setText($('sub'), sub);
  $('sub').hidden = !sub;

  // The time left, worked out from the driver's last position — and only while it's current:
  // a time from a position gone quiet would be a guess passed off as an estimate.
  if (etaTarget) {
    $('etaBlock').hidden = false;
    setText($('etaCaption'), etaCaption);
    setText($('eta'), !loc
      ? 'جارٍ تحديد موقع السائق...'
      : stale
        ? 'غير متاح حاليًا'
        : etaPhrase(etaMinutes(loc, etaTarget)));
  } else {
    $('etaBlock').hidden = true;
  }

  // The server leaves the position out once it's 15 minutes old.
  const noPosition = live && trip.driver && !loc && ACTIVE.includes(status);
  $('staleNotice').classList.toggle('on', Boolean(stale || noPosition));
  setText($('staleText'), noPosition
    ? 'موقع السائق غير متاح حاليًا، وقد يكون اتصاله ضعيفًا.'
    : stale
      ? staleMessage(age)
      : '');

  const driver = live ? trip.driver : null;
  $('driverCard').classList.toggle('on', Boolean(driver));
  if (driver) {
    const name = driver.first_name || 'السائق';
    setText($('driverInitial'), name.charAt(0));
    setText($('driverName'), name);
    setText($('driverCar'), [[driver.vehicle_make, driver.vehicle_model].filter(Boolean).join(' '), driver.vehicle_color]
      .filter(Boolean).join(' · '));
    setText($('driverPlate'), driver.vehicle_plate || '—');
  }

  setText($('pickupText'), cleanAddress(trip.pickup.address) || 'موقع محدد على الخريطة');
  setText($('dropoffText'), cleanAddress(trip.dropoff.address) || 'موقع محدد على الخريطة');
  $('pickupText').classList.toggle('done', onBoard || status === 'completed');

  setText($('updatedAt'), live ? 'آخر تحديث: ' + formatTime(new Date().toISOString()) : '');

  renderMap(trip);
}

/** Writes only a change, so a screen reader announces news rather than every refresh. */
function setText(el, text) {
  if (el.textContent !== text) el.textContent = text;
}

function staleMessage(age) {
  return 'لم يُحدَّث موقع السائق ' + sincePhrase(age) + '، فقد لا يكون موقعه على الخريطة دقيقًا.';
}

// The age of the driver's position keeps growing between answers.
setInterval(() => {
  if (lastAnswer && lastAnswer.state === 'live' && $('liveView').classList.contains('on')) renderStaleOnly(lastAnswer);
}, 5000);

function renderStaleOnly(trip) {
  const age = locationAgeMs(trip);
  if (age == null) return;
  const stale = age > STALE_MS;
  $('staleNotice').classList.toggle('on', stale);
  if (stale) {
    setText($('staleText'), staleMessage(age));
    if (!$('etaBlock').hidden) setText($('eta'), 'غير متاح حاليًا');
  }
  if (markers.car) markers.car.getElement().classList.toggle('faded', stale);
}

// ---------------------------------------------------------------------------
// Start
// ---------------------------------------------------------------------------
if (!configured) showMessage(...MESSAGES.unbuilt);
else if (!token) showMessage(...MESSAGES.invalid);
else poll();
</script>
</body>
</html>
